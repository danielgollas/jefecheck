<link rel="stylesheet" type="text/css" href="css/slideshow.css" media="screen" />
<link rel="stylesheet" type="text/css" href="css/lightbox.css" media="screen" />

    <script type="text/javascript" src="js/mootools.js"></script>
	<script type="text/javascript" src="js/slideshow.js"></script>
	<script type="text/javascript" src="js/lightbox.js"></script>

	<script type="text/javascript">		
	//<![CDATA[
	  window.addEvent('domready', function(){
	    var data = {
	      'ss_GreenKM31_thumb.jpg': { caption: 'Quick and drity realtime 2k chromas' }, 
	      'ss_exrRange_thumb.jpg': { caption: 'A Ceibu tree.' }, 
	      'ss_dpxMetadata_thumb.jpg': { caption: 'The view from Volcano Maderas.' }, 
	      'ss_colibriAlpha_thumb.jpg': { caption: 'Beer and ice cream.' }
	    };
	    // Note the use of "linked: true" which tells Slideshow to auto-link all slides to the full-size image.
	    var myShow = new Slideshow('show', data, { captions: true, controller: true, delay: 3000, hu: 'images/', linked: true, width: 235, height: 176 });
	    // Here we create the Lightbox instance.
	    // In this case we will use the "close" and "open" callbacks to pause our show while the modal window is visible.
      var box = new Lightbox({ 
			  'onClose': function(){ this.pause(false); }.bind(myShow), 
			  'onOpen': function(){ this.pause(true); }.bind(myShow) 
			});
			
		});
	//]]>
	</script>


</head>

<body>

<div id="show" class="slideshow">
    			<a rel="lightbox" href="images/ss_GreenKM31_thumb.jpg">
			      <img src="images/ss_GreenKM31_thumb.jpg" width="235" height="172" alt="Slideshow 2! Example 2: Integration with Lightbox" />
			    </a>
 			 </div>

</body>
