name: Deploy GitHub Pages

on:
  push:
    tags: ['website-v*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer one supersede an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # feature notes quote code at old commits
      - name: Fetch PR heads (notes pin squash-merged PR heads)
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Build feature notes (unlisted)
        run: python3 tools/feature-notes/feature_notes.py build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
