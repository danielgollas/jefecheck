name: Build

on:
  push:
    branches: [modernize-opensource, master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libfltk1.3-dev \
            libopenimageio-dev \
            openimageio-tools \
            libopenexr-dev \
            libilmbase-dev \
            libimath-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            freeglut3-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libopencv-dev \
            libglu1-mesa-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fltk openimageio openexr curl zlib cmake

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

  build-windows:
    if: false  # Disabled until Windows port is tested
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '01f602195983451bc83e72f4214af2cbc495aa94'

      - name: Install dependencies
        run: vcpkg install fltk openimageio openexr curl zlib --triplet x64-windows

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release
