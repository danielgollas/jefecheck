name: Build

on:
  push:
    branches: [modernize-opensource, master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libfltk1.3-dev \
            libopenimageio-dev \
            openimageio-tools \
            libopenexr-dev \
            libilmbase-dev \
            libimath-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            freeglut3-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libopencv-dev \
            libglu1-mesa-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fltk openimageio openexr curl zlib cmake

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-fltk
            mingw-w64-x86_64-openimageio
            mingw-w64-x86_64-openexr
            mingw-w64-x86_64-imath
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-fmt

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build -j$(nproc)
