name: Build

on:
  push:
    branches: [modernize-opensource, master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libfltk1.3-dev \
            libopenimageio-dev \
            openimageio-tools \
            libopenexr-dev \
            libilmbase-dev \
            libimath-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            freeglut3-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libopencv-dev \
            libglu1-mesa-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fltk openimageio openexr curl zlib cmake

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Enable vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: .\vcpkg\vcpkg install fltk openimageio openexr curl zlib --triplet x64-windows
        timeout-minutes: 30

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release
