name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'packaging/**'
      - 'Casks/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/release.yml'
      - '.github/workflows/update-manifests.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'packaging/**'
      - 'Casks/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/release.yml'
      - '.github/workflows/update-manifests.yml'
      - '.github/workflows/pages.yml'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            qt6-base-dev \
            qt6-base-private-dev \
            libqt6opengl6-dev \
            libopenimageio-dev \
            openimageio-tools \
            libopencv-dev \
            libopenexr-dev \
            libilmbase-dev \
            libimath-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libfreetype6-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt openimageio openexr curl zlib cmake freetype

      - name: Add Qt to CMAKE_PREFIX_PATH
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-openimageio
            mingw-w64-x86_64-openexr
            mingw-w64-x86_64-imath
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-fmt
            mingw-w64-x86_64-freetype

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles"

      - name: Build
        run: cmake --build build -j$(nproc)
