name: Sync Cask to Homebrew tap

on:
  push:
    branches: [main]
    paths:
      - 'Casks/jefecheck.rb'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: danielgollas/homebrew-jefecheck
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Copy Cask and push
        run: |
          set -e
          cp source/Casks/jefecheck.rb tap/Casks/jefecheck.rb
          cd tap
          if git diff --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          VERSION=$(grep -E '^  version' Casks/jefecheck.rb | sed -E 's/.*"([^"]+)".*/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/jefecheck.rb
          git commit -m "sync: JefeCheck v${VERSION} from upstream"
          git push
