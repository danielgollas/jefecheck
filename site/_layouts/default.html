<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #121212;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #242424;
      --bg-card: #1e1e1e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --text-muted: #707070;
      --accent: #e8a020;
      --accent-dim: #c08018;
      --accent-glow: rgba(232, 160, 32, 0.15);
      --border: #333;
      --code-bg: #0d0d0d;
      --max-width: 960px;
      --max-width-wide: 1200px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      font-size: 16px;
    }

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: #f0c060; text-decoration: underline; }

    /* Navigation */
    nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-inner {
      max-width: var(--max-width-wide); margin: 0 auto; padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
    }
    .nav-brand { font-weight: 700; font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
    .nav-brand:hover { text-decoration: none; color: #f0c060; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
    .nav-links a {
      color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
      padding: 0.25rem 0; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text-primary); border-bottom-color: var(--accent); text-decoration: none; }
    .nav-toggle { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }

    /* Content */
    .content { max-width: var(--max-width); margin: 0 auto; padding: 2rem 2rem 4rem; }
    .content h1 { font-size: 2rem; margin: 2rem 0 1rem; color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .content h2 { font-size: 1.5rem; margin: 2.5rem 0 1rem; color: var(--accent); }
    .content h3 { font-size: 1.2rem; margin: 2rem 0 0.75rem; color: var(--text-primary); }
    .content h4 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; color: var(--text-secondary); }
    .content p { margin: 0 0 1rem; }
    .content ul, .content ol { margin: 0 0 1rem; padding-left: 2rem; }
    .content li { margin: 0.25rem 0; }
    .content li > ul, .content li > ol { margin: 0.25rem 0 0; }
    .content blockquote {
      border-left: 3px solid var(--accent); margin: 1rem 0; padding: 0.75rem 1rem;
      background: var(--bg-tertiary); border-radius: 0 4px 4px 0; color: var(--text-secondary);
    }
    .content blockquote p:last-child { margin-bottom: 0; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

    /* Code */
    .content code {
      background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 3px;
      font-size: 0.9em; font-family: "SF Mono", "Fira Code", Consolas, monospace; color: #d4976c;
    }
    .content pre {
      background: var(--code-bg); padding: 1rem 1.25rem; border-radius: 6px;
      overflow-x: auto; margin: 0 0 1.5rem; border: 1px solid var(--border);
    }
    .content pre code { background: none; padding: 0; font-size: 0.85em; color: var(--text-primary); }

    /* Tables */
    .content table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.5rem; font-size: 0.95em; }
    .content th, .content td { padding: 0.6rem 1rem; border: 1px solid var(--border); text-align: left; }
    .content th { background: var(--bg-tertiary); color: var(--accent); font-weight: 600; }
    .content td { background: var(--bg-secondary); }

    /* Images */
    .content img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); margin: 1rem 0; display: block; }

    /* Footer */
    footer {
      background: var(--bg-secondary); border-top: 1px solid var(--border);
      padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; line-height: 1.8;
    }
    footer a { color: var(--text-secondary); }
    footer a:hover { color: var(--accent); }

    /* Responsive */
    @media (max-width: 700px) {
      .nav-toggle { display: block; }
      .nav-links {
        display: none; flex-direction: column; position: absolute; top: 56px; left: 0; right: 0;
        background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 1rem 2rem; gap: 0.75rem;
      }
      .nav-links.open { display: flex; }
      .content { padding: 1.5rem 1rem 3rem; }
      .content h1 { font-size: 1.5rem; }
      .content h2 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-brand">JefeCheck</a>
      <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/quick-start' | relative_url }}" {% if page.url contains 'quick-start' %}class="active"{% endif %}>Quick Start</a></li>
        <li><a href="{{ '/manual' | relative_url }}" {% if page.url contains 'manual' %}class="active"{% endif %}>Manual</a></li>
        <li><a href="{{ '/building' | relative_url }}" {% if page.url contains 'building' %}class="active"{% endif %}>Build</a></li>
        <li><a href="https://github.com/danielgollas/jefecheck" target="_blank">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  <footer>
    <div>JefeCheck &copy; 2006&ndash;2026 Daniel Goll&aacute;s. Licensed under <a href="https://www.gnu.org/licenses/old-licenses/gpl-2.0.html">GPL v2</a>.</div>
    <div>Hecho en M&eacute;xico &#127474;&#127485;</div>
  </footer>
</body>
</html>
